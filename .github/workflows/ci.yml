# Run the tests on every push and pull request.
# No Docker and no secrets: the tests build a temporary SQLite database (tests/conftest.py) and use
# data/processed/credit_clean.parquet + models/ from git - data/raw (git-ignored) is not needed.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy values only (tests/conftest.py sets its own test values as well)
      DATABASE_URL: sqlite:///./ci_test.db
      JWT_SECRET: ci-dummy-secret-not-used-in-production
      ADMIN_PASSWORD: ci-dummy-admin-password
      OFFICER_PASSWORD: ci-dummy-officer-password
      DRIFT_SCHEDULER: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-frontend.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
