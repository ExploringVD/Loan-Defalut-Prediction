# Only PostgreSQL for now. API and frontend containers are added in the packaging step.
services:
  db:
    image: postgres:16
    container_name: loan_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loan_pass_local}
      POSTGRES_DB: ${POSTGRES_DB:-loan_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
