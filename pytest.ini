[pytest]
# Only run the current tests (archive/ holds old Lending Club code that is not maintained)
testpaths = tests
norecursedirs = archive .venv mlruns
# Notices raised inside libraries, not by our code:
#  - shap: matplotlib colormap deprecation
#  - passlib 1.7.4 imports Python's crypt module (removed in Python 3.13; fine on our 3.12)
#  - starlette: suggests the httpx2 package for its TestClient
filterwarnings =
    ignore::PendingDeprecationWarning:shap.*
    ignore:'crypt' is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
